site_name: Git-ftp
site_description: Upload to FTP servers the Git way — deploy a Git repository over FTP, FTPS, FTPES or SFTP, uploading only the files that changed.
site_url: https://git-ftp.github.io/
site_author: René Moser and the git-ftp contributors
copyright: Git-ftp is licensed under the GNU General Public License, Version 3.0

repo_url: https://github.com/git-ftp/git-ftp.github.io
repo_name: git-ftp.github.io
edit_uri: edit/master/docs/

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
    logo: material/cloud-upload-outline
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.tabs.link

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/git-ftp
      name: git-ftp on GitHub
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/git-ftp/
      name: git-ftp on PyPI

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

nav:
  - Home: index.md
  - Getting started:
      - getting-started/index.md
      - Install: getting-started/install.md
      - First deployment: getting-started/first-deployment.md
      - Which implementation: getting-started/implementations.md
  - Guide:
      - Configuration: guide/configuration.md
      - Scopes: guide/scopes.md
      - Selecting files: guide/selecting-files.md
      - Protocols and credentials: guide/protocols.md
      - Hooks and locking: guide/hooks-and-locking.md
      - Downloading from the server: guide/download.md
      - Continuous deployment: guide/ci-cd.md
      - Troubleshooting: guide/troubleshooting.md
  - Reference:
      - Manual (Python): reference/manual-python.md
      - Manual (Bash): reference/manual-bash.md
      - Compatibility: reference/compatibility.md
  - About:
      - Contributing: about/contributing.md
      - License: about/license.md
